services:
  postgres:
    image: postgres:16-alpine
    container_name: medv_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medv_db
      POSTGRES_USER: medv_user
      POSTGRES_PASSWORD: medv_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medv_user -d medv_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
